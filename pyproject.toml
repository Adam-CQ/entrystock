[project]
name = "entrystock"
version = "0.1.0"
description = "Explainable investor analysis workflow"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]==5.6.3",
    "Django==6.1.1",
    "fastapi==0.141.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-django==4.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
DJANGO_SETTINGS_MODULE = "config.settings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "api", "analytics", "companies"]
